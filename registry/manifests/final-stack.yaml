{
  "schema_version": 1,
  "lifecycle_owner": "compound-engineering",
  "native_skill_discovery_required": true,
  "superpowers": {
    "bootstrap": false,
    "global_routing": false,
    "inactive": [
      "superpowers/brainstorming",
      "superpowers/dispatching-parallel-agents",
      "superpowers/executing-plans",
      "superpowers/finishing-a-development-branch",
      "superpowers/requesting-code-review",
      "superpowers/subagent-driven-development",
      "superpowers/using-git-worktrees",
      "superpowers/using-superpowers",
      "superpowers/writing-plans"
    ],
    "retained_support": [
      "superpowers/receiving-code-review",
      "superpowers/systematic-debugging",
      "superpowers/test-driven-development",
      "superpowers/verification-before-completion",
      "superpowers/writing-skills"
    ]
  },
  "active_default": true,
  "worker_catalog": {
    "lead": "compound-engineering lifecycle plus eligible supporting skills",
    "worker": "assignment-relevant capabilities only",
    "sub-agent": "assignment-relevant capabilities inherited from the locked catalog",
    "container": "same lock and policy projection",
    "remote": "same lock and policy projection"
  },
  "policy": {
    "ce_owns": [
      "ideation",
      "planning",
      "orchestration",
      "integration",
      "review",
      "delivery",
      "documentation",
      "compounding"
    ],
    "superpowers_supports": "a selected CE unit without replacing its lifecycle artifact",
    "using_superpowers_invocation_required": false,
    "specialist_routing": "Select the narrowest applicable specialist after CE owns the lifecycle. Supporting skills change method, tools, constraints, or verification only; they never replace the authoritative CE artifact or own planning, integration, delivery, documentation, or compounding."
  },
  "behavioral_layers": {
    "ponytail": {
      "owner": "ponytail",
      "default_mode": "full",
      "automatic": true
    },
    "caveman": {
      "owner": "caveman",
      "automatic": true
    }
  },
  "startup_layers": [
    "caveman",
    "hhpe-hrg/session-start"
  ],
  "session_start": "hhpe-hrg/session-start",
  "specialists_are_task_triggered": true,
  "no_routine_slash_invocation": true,
  "beads": {
    "active": false,
    "executable": null,
    "authority": "hhpe task graph",
    "reason": "HHPE already owns readiness, claims, dependencies, blockers, and completion state; Beads is not installed"
  },
  "specialist_routing": {
    "semantic symbols, references, implementations, semantic rename": "hhpe-hrg/serena-guidance",
    "current external library or SDK documentation": "hhpe-hrg/context7-guidance",
    "syntax-tree search and codemod": "hhpe-hrg/ast-grep",
    "browser and UI acceptance": "hhpe-hrg/playwright-guidance",
    "physical equations and units": "trailofbits/dimensional-analysis",
    "invariants, parsers, serialization, state machines": "trailofbits/property-based-testing",
    "security-sensitive diff": "trailofbits/differential-review",
    "dependency or lockfile change": "trailofbits/supply-chain-risk-auditor",
    "static analysis": "trailofbits/static-analysis/semgrep",
    "Rust safety, FFI, or concurrency": "trailofbits/rust-review",
    "C or C++ memory and undefined behavior": "trailofbits/c-review",
    "dangerous API or configuration": "trailofbits/sharp-edges"
  },
  "task_language_lifecycle_routing": {
    "investigate": "compound-engineering/research-or-investigate",
    "design-or-architect": "compound-engineering/investigate-then-plan",
    "plan": "compound-engineering/plan",
    "implement": "compound-engineering/work",
    "fix-or-debug": "compound-engineering/debug",
    "review": "compound-engineering/review",
    "simplify": "compound-engineering/simplify",
    "document-what-was-learned": "compound-engineering/compound",
    "continue-current-work": "hhpe-hrg/session-start -> active-ce-artifact"
  },
  "automatic_selection_policy": "Use native host discovery to select relevant lifecycle and specialist capabilities from the complete task. Compound Engineering is the primary engineering lifecycle. Select supporting capabilities only when they materially change the method, tools, constraints, or verification needed for the task. Prefer the narrowest applicable specialist. Do not invoke multiple capabilities that own the same lifecycle responsibility. Supporting skills may affect how a CE unit is completed, but may not replace the authoritative CE artifact or take ownership of integration, delivery, documentation, or compounding. Routine explicit slash invocation is not required.",
  "natural_language_routing_fixtures": [
    {
      "id": "investigation",
      "prompt_contains": [
        "investigate",
        "serialization",
        "transitive risk"
      ],
      "primary_lifecycle": "compound-engineering/investigate",
      "specialists": [
        "hhpe-hrg/context7-guidance",
        "trailofbits/supply-chain-risk-auditor"
      ],
      "must_not_require_skill_names": true
    },
    {
      "id": "architecture",
      "prompt_contains": [
        "architecture",
        "distributing",
        "canonical registry"
      ],
      "primary_lifecycle": "compound-engineering/investigate-then-plan",
      "specialists": [
        "trailofbits/supply-chain-risk-auditor"
      ],
      "must_not_require_skill_names": true
    },
    {
      "id": "implementation",
      "prompt_contains": [
        "continue from the active engineering state",
        "durable recovery"
      ],
      "primary_lifecycle": "compound-engineering/work",
      "specialists": [
        "superpowers/test-driven-development",
        "superpowers/verification-before-completion"
      ],
      "must_not_require_skill_names": true
    },
    {
      "id": "debugging",
      "prompt_contains": [
        "fix the failure",
        "incomplete specialist catalog"
      ],
      "primary_lifecycle": "compound-engineering/debug",
      "specialists": [
        "superpowers/systematic-debugging"
      ],
      "must_not_require_skill_names": true
    },
    {
      "id": "review",
      "prompt_contains": [
        "review the current branch",
        "safe to merge"
      ],
      "primary_lifecycle": "compound-engineering/review",
      "specialists": [
        "trailofbits/differential-review"
      ],
      "must_not_require_skill_names": true
    },
    {
      "id": "physical-model",
      "prompt_contains": [
        "thermodynamic",
        "dimensional"
      ],
      "primary_lifecycle": "compound-engineering/work",
      "specialists": [
        "trailofbits/dimensional-analysis",
        "trailofbits/property-based-testing"
      ],
      "must_not_require_skill_names": true
    },
    {
      "id": "ui-behavior",
      "prompt_contains": [
        "dashboard workflow",
        "browser interaction"
      ],
      "primary_lifecycle": "compound-engineering/work",
      "specialists": [
        "hhpe-hrg/playwright-guidance"
      ],
      "must_not_require_skill_names": true
    }
  ],
  "external_vendors_manifest": "registry/manifests/vendors.yaml",
  "semantic_code_intelligence": {
    "owner": "oraios",
    "package_id": "serena",
    "marketplace_identity": "io.github.oraios/serena",
    "vend_kind": "mcp_server_package",
    "routing_wrapper": "hhpe-hrg/serena-guidance",
    "runtime_capability": "serena/serena-runtime",
    "mcp_capability": "serena/serena-mcp"
  },
  "documentation_grounding": {
    "owner": "upstash",
    "package_id": "context7",
    "marketplace_identity": "io.github.upstash/context7",
    "vend_kind": "mcp_server_package",
    "initiation_kind": "mcp_repository",
    "application_transport": "cli_plus_skill_preferred",
    "routing_wrapper": "hhpe-hrg/context7-guidance",
    "runtime_capability": "context7/context7-cli",
    "mcp_capability": "context7/context7-mcp"
  },
  "browser_acceptance": {
    "owner": "microsoft",
    "framework": "https://github.com/microsoft/playwright",
    "mcp_package_id": "playwright-mcp",
    "marketplace_identity": "io.github.microsoft/playwright-mcp",
    "vend_kind": "mcp_server_package",
    "initiation_kind": "mcp_repository",
    "application_transport": "cli_plus_skill_preferred",
    "routing_wrapper": "hhpe-hrg/playwright-guidance",
